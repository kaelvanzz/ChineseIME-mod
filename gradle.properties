# Gradle 配置
org.gradle.jvmargs=-Xmx8G --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=16

# Mod 属性
mod_version=1.0.0
maven_group=com.example.chineseime
archives_base_name=chineseime

# Minecraft 版本
minecraft_version=1.21.4

# Yarn 映射
yarn_mappings=1.21.4+build.1

# Fabric Loader
loader_version=0.16.9

# Fabric API (1.21.4)
fabric_version=0.110.5+1.21.4

# AutoConfig (配置库)
autoconfig_version=1.8.0

# LWJGL AWT (Java 21 兼容)
lwjgl_version=3.3.4
